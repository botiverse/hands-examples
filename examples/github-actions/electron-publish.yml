# Publish Electron installers to Hands from GitHub Actions.
#
# Shape: each platform builds and uploads its artifacts; ONE publish job then
# creates a single multi-asset draft release (the metadata/installer/blockmap
# flags are repeatable). One release carries all platforms.
name: Publish Electron to Hands

on:
  workflow_dispatch:
    inputs:
      version_name:
        required: true
      version_code:
        required: true
      channel:
        required: true
        default: "main"

env:
  HANDS_APP_SLUG: your-app-slug   # <-- your Hands app slug

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # --- Replace with your own electron-builder step (signing included). ---
      - name: Build installers
        run: |
          echo "e.g. npx electron-builder --publish never"
          echo "requirement: installer + latest*.yml (+ .blockmap) in dist/"
      # ----------------------------------------------------------------------

      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}
          path: |
            dist/latest*.yml
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-all/

      - name: Install Hands CLI
        run: npm install -g @botiverse/hands-cli@0.5.1

      - name: Publish one multi-asset draft release
        shell: bash
        env:
          HANDS_BEARER_TOKEN: ${{ secrets.HANDS_DEPLOY_TOKEN }}
        run: |
          git log --no-merges --pretty='- %s' -15 > changelog.txt
          ARGS=(
            --channel "${{ inputs.channel }}"
            --version-name "${{ inputs.version_name }}"
            --version-code "${{ inputs.version_code }}"
            --changelog-file ./changelog.txt
            --draft
          )
          while IFS= read -r f; do ARGS+=(--metadata "$f"); done < <(find dist-all -name 'latest*.yml')
          while IFS= read -r f; do ARGS+=(--installer "$f"); done < <(find dist-all \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \))
          while IFS= read -r f; do ARGS+=(--blockmap "$f"); done < <(find dist-all -name '*.blockmap')
          hands builds publish-electron "$HANDS_APP_SLUG" "${ARGS[@]}"
